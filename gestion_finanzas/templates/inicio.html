<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Financiero</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f6fa;
}

.barra-superior{
    background:#4f46e5;
    color:white;
    padding:20px;
}

.sidebar{
    width:230px;
    height:100vh;
    background:#4f46e5;
    position:fixed;
    left:0;
    top:0;
    border-right:1px solid #e4e4e4;
    padding-top:20px;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar li{
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    color:#fbfafa;
}

.sidebar li:hover{
    background:#f0f2f5;
}



.icon{
    width:24px;
    height:24px;
    background:#eaeaea;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
}

.content{
    margin-left:230px;
    padding:30px;
}

h1{
    text-align:center;
    color:#fbf8f8;
}

a{
    text-decoration:none;
    color:white;
    display:flex;
    gap:10px;
    align-items:center;
}


</style>
</head>

<body>

<div class="sidebar">
    <ul>
        <li>
            <a href="/finanzas/dashboard/">
            <div class="icon">🏠</div>
            Dashboard
            </a>
        </li>


       <li>
         <a href="/finanzas/gastos/">
           <div class="icon">📚</div>
             Gastos
         </a>
       </li>
       <li>
        <a href="/usuarios/index/" class="text-white-50 text-decoration-none" style="font-size: 12px; display:block; text-align:right;">  ← Menu principal</a>
       </li>

    </ul>
</div>

<header class="barra-superior">
    <h1 class="titulo">FINANZAS</h1>
</header>

<div class="content">
    <img src="https://www.slideteam.net/wp/wp-content/uploads/2023/07/Panel-de-analisis-de-tendencias-financieras-para-la-gestion-de-efectivo-2.png" alt="panel">
</div>

</body>
</html>
