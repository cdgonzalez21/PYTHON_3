{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block titulo %}Dashboard{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'gestion_usuarios/base.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'gestion_usuarios/forms.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'gestion_usuarios/tables.css' %}?v=1">

</head>

<body>

    <div class="header">

        <div class="logout">
            <a href="{% url 'gestion_usuarios:logout' %}">
                Cerrar sesion
            </a>
        </div>

        <h2>
            {% block encabezado %}Panel{% endblock %}
        </h2>

        <p>
            {% block subtitulo %}Sistema Microempresarios{% endblock %}
        </p>

    </div>

    <div class="container">
        {% block contenido %}{% endblock %}
    </div>

</body>
</html>
