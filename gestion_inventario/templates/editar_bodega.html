{% extends "layout.html" %}

{% block contenido %}
<h1 class="page-title">Editar Bodega</h1>
<p class="page-subtitle">Modifica los datos de la bodega</p>

<div class="form-card">
    <div class="form-card-header">
        <h2>{{ bodega.nombre }}</h2>
        <p>Actualiza los campos que desees cambiar</p>
    </div>
    <div class="form-card-body">
        <form method="POST" action="{% url 'gestion_inventario:actualizar_bodega' bodega.id %}">
            {% csrf_token %}

            <div class="form-group" style="margin-bottom:16px;">
                <label>Nombre de la bodega</label>
                <input type="text" name="nombre" value="{{ bodega.nombre }}" class="form-control-inv">
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Ubicacion</label>
                <input type="text" name="ubicacion" value="{{ bodega.ubicacion }}" class="form-control-inv">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-inv btn-primary-inv">Actualizar bodega</button>
                <a href="{% url 'gestion_inventario:lista_bodegas' %}" class="btn-inv btn-secondary-inv">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
