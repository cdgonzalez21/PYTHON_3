<div class="card border-0 shadow-sm">
    <div class="list-group list-group-flush">
        {% for producto in productos %}
        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
            <div>
                <div style="font-size: 14px; font-weight: 500; color: #212529;">{{ producto.nombre }}</div>
                <div style="font-size: 12px; color: #888;">Precio: ${{ producto.precio }}</div>
            </div>
            <div class="d-flex align-items-center gap-2">
                {% if producto.stock > 0 %}
                    <span class="badge rounded-pill" style="background: #e6f4ea; color: #2e7d32; font-size: 11px;">{{ producto.stock }} en stock</span>
                {% else %}
                    <span class="badge rounded-pill" style="background: #fdecea; color: #c62828; font-size: 11px;">Agotado</span>
                {% endif %}
                <a href="{% url 'gestion_inventario:producto_detalle' producto.id %}" style="font-size: 12px; color: #212529; text-decoration: none;">Ver</a>
                <a href="{% url 'gestion_inventario:editar_producto' producto.id %}" style="font-size: 12px; color: #0d6efd; text-decoration: none;">Editar</a>
                <a href="{% url 'gestion_inventario:eliminar_producto' producto.id %}" style="font-size: 12px; color: #dc3545; text-decoration: none;" onclick="return confirm('Seguro que deseas eliminar este producto?')">Eliminar</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
