{% extends "layout.html" %}

{% block contenido %}
<h1 class="page-title">Editar Producto</h1>
<p class="page-subtitle">Modifica los datos del producto</p>

<div class="form-card">
    <div class="form-card-header">
        <h2>{{ producto.nombre }}</h2>
        <p>Actualiza los campos que desees cambiar</p>
    </div>
    <div class="form-card-body">
        <form method="POST" action="{% url 'gestion_inventario:actualizar_producto' producto.id %}">
            {% csrf_token %}

            <div class="form-grid-2">
                <div class="form-group full">
                    <label>Nombre del producto</label>
                    <input type="text" name="nombre" value="{{ producto.nombre }}" class="form-control-inv">
                </div>
                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" name="precio" step="0.01" value="{{ producto.precio }}" class="form-control-inv">
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="number" name="stock" value="{{ producto.stock }}" class="form-control-inv">
                </div>
                <div class="form-group">
                    <label>Garantia (meses)</label>
                    <input type="number" name="garantia_meses" value="{{ producto.garantia_meses }}" class="form-control-inv">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    {{ formulario.categoria }}
                </div>
                <div class="form-group full">
                    <label>Bodega (opcional)</label>
                    {{ formulario.bodega }}
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-inv btn-primary-inv">Actualizar producto</button>
                <a href="{% url 'gestion_inventario:lista_productos' %}" class="btn-inv btn-secondary-inv">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
