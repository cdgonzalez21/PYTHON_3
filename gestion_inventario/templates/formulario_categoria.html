{% extends "layout.html" %}

{% block contenido %}
<h1 class="page-title">Agregar Categoria</h1>
<p class="page-subtitle">Crea una categoria para organizar tus productos</p>

<div class="form-card">
    <div class="form-card-header">
        <h2>Nueva Categoria</h2>
        <p>Ej: Electrodomesticos, Accesorios, Hogar</p>
    </div>
    <div class="form-card-body">
        <form method="POST" action="{% url 'gestion_inventario:guardar_categoria' %}">
            {% csrf_token %}

            <div class="form-group" style="margin-bottom:16px;">
                <label>Nombre de la categoria</label>
                {{ formulario.nombre }}
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Descripcion <span style="font-weight:400;color:#9ca3af;">(opcional)</span></label>
                {{ formulario.descripcion }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-inv btn-primary-inv">Guardar categoria</button>
                <a href="{% url 'gestion_inventario:lista_categorias' %}" class="btn-inv btn-secondary-inv">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
