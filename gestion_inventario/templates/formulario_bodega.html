{% extends "layout.html" %}

{% block contenido %}
<h1 class="page-title">Agregar Bodega</h1>
<p class="page-subtitle">Registra una nueva bodega de almacenamiento</p>

<div class="form-card">
    <div class="form-card-header">
        <h2>Nueva Bodega</h2>
        <p>Ej: Bodega Central, Deposito Norte</p>
    </div>
    <div class="form-card-body">
        <form method="POST" action="{% url 'gestion_inventario:guardar_bodega' %}">
            {% csrf_token %}

            <div class="form-group" style="margin-bottom:16px;">
                <label>Nombre de la bodega</label>
                {{ formulario.nombre }}
            </div>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Ubicacion</label>
                {{ formulario.ubicacion }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-inv btn-primary-inv">Guardar bodega</button>
                <a href="{% url 'gestion_inventario:lista_bodegas' %}" class="btn-inv btn-secondary-inv">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
